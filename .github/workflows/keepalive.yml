name: Supabase keepalive

"on":
  schedule:
    - cron: "17 2 */3 * *"   # tiap 3 hari, 09:17 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 401/403 = Supabase aktif tapi data dilindungi RLS (normal).
          # Gagal hanya jika server tidak bisa dihubungi atau error 5xx (mis. project di-pause).
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/app_data?select=data_key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" || true)
          echo "Supabase menjawab HTTP $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "Supabase tidak bisa dihubungi atau sedang di-pause"; exit 1
          fi
