function impGuess(headers){

function toNum(v){

}
const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,agt:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function toDate(v,fmt){
 if(v==null||v==="")return "";
 if(v instanceof Date&&!isNaN(v))return ymd(v.getFullYear(),v.getMonth()+1,v.getDate());

 if(m=t.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return ymd(+m[1],+m[2],+m[3]);
 if(m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;const dmyF=fmt==="dmy"||(fmt!=="mdy"&&a>12);return dmyF?ymd(y,b,a):ymd(y,a,b)}

function impJson(obj){

async function impRead(file){

 const blocks=[];let st=null;H.forEach((h,i)=>{if(h){if(st==null)st=i}else if(st!=null){blocks.push([st,i]);st=null}});if(st!=null)blocks.push([st,H.length]);

  const hs=[],idx=[];blocks.forEach((b,bi)=>{for(let i=b[0];i<b[1];i++){if(bi>0&&i===b[0])continue;if(hs.includes(H[i]))continue;hs.push(H[i]);idx.push(i)}});

const UNDO=[];

const KTAB={tracker:"tracker",insight:"insight",todo:"todo",followers:"followers",rep_ig:"lap",rep_tt:"lap"};

function toast(msg,action,fn){
 let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t)}
 t.innerHTML=`<span>${esc(msg)}</span>`+(action?`<button class="b" id="toast_b">${esc(action)}</button>`:"");t.className="on";
 if(action)$("#toast_b").onclick=()=>{fn();t.className=""};

function trashRow(k,id){
 const r=S[k].find(x=>x.id===id);if(!r)return;
 S[k]=S[k].filter(x=>x.id!==id);S.trash.unshift({tid:id+"-"+Date.now().toString(36),k,row:r,at:Date.now()});
 UNDO.push({type:"del",k,id});persist(k);persist("trash");render();
 toast(`“${rowName(k,r)}” dipindahkan ke Tempat Sampah.`,"Batalkan",undo);
}
function restoreTrash(tid,quiet){
 const t=S.trash.find(x=>x.tid===tid);if(!t)return false;
 if(!Array.isArray(S[t.k]))S[t.k]=[];
 if(!S[t.k].some(x=>x.id===t.row.id))S[t.k].push(t.row);
 S.trash=S.trash.filter(x=>x.tid!==tid);persist(t.k);persist("trash");
 if(!quiet)toast(`“${rowName(t.k,t.row)}” dipulihkan ke ${KLBL[t.k]||t.k}.`);
 return true;
}
function undo(){

 const u=UNDO.pop();if(!u){toast("Tidak ada perubahan untuk dibatalkan.");return}
 if(u.type==="del"){const t=S.trash.find(x=>x.k===u.k&&x.row.id===u.id);if(t){restoreTrash(t.tid,true);toast("Penghapusan dibatalkan.")}}
 else if(u.type==="edit"){const i=S[u.k].findIndex(x=>x.id===u.before.id);if(i>=0){S[u.k][i]=u.before;persist(u.k);toast("Perubahan dibatalkan.")}}
 else if(u.type==="add"){const r=S[u.k].find(x=>x.id===u.id);if(r){S[u.k]=S[u.k].filter(x=>x.id!==u.id);persist(u.k);toast("Data yang baru ditambahkan dibatalkan.")}}
 render();
}

  PL.forEach(p=>{const rows=R.filter(r=>r.platform===p);if(!rows.length)return;const v=sm(rows,"views"),e=sm(rows,"likes")+sm(rows,"comments")+sm(rows,"shares")+sm(rows,"saves");h+=`<tr><td>${esc(p)}</td><td class="r">${rows.length}</td><td class="r">${n0(v)}</td><td class="r">${n0(sm(rows,"likes"))}</td><td class="r">${n0(sm(rows,"comments"))}</td><td class="r">${n0(sm(rows,"shares"))}</td><td class="r">${n0(sm(rows,"saves"))}</td><td class="r">${v?(e/v*100).toFixed(1)+"%":"–"}</td></tr>`});
  h+=`</table></div><h3 class="kd-h" style="margin-top:12px">5 konten dengan views tertinggi</h3><div class="scroll"><table><tr><th>#</th><th>Konten</th><th>Platform</th><th>Tayang</th><th class="r">Views</th></tr>`+R.slice().sort((a,b)=>(+b.views||0)-(+a.views||0)).slice(0,5).map((r,i)=>`<tr><td>${i+1}</td><td class="wrap">${esc(r.title)}</td><td>${esc(r.platform)}</td><td>${dmy(r.pub)}</td><td class="r">${n0(r.views)}</td></tr>`).join("")+`</table></div>`;
  return R.length?h:`<p class="note">Belum ada data insight.</p>`;
 }
 return "";
}

/* ---------- hak akses: viewer = lihat saja ---------- */
const ROLE_LBL={owner:"Owner",editor:"Editor",viewer:"Viewer (lihat saja)"};
function isViewer(){return window.ITSB_ROLE==="viewer"}
function applyRole(session){
 const r=window.ITSB_ROLE;document.body.classList.toggle("ro",r==="viewer");
 const p=document.querySelector("header .profile>div:not(.avatar)");
 if(p&&session&&session.user){const em=session.user.email||"";p.innerHTML=`<b>${esc(em.split("@")[0]||"Pengguna")}</b><br><span class="sub">${esc(ROLE_LBL[r]||r||"")}</span>`;p.title=em}
}
const ptg=p=>{const t=S.settings.pt;return t&&t[p[0]]!=null?+t[p[0]]:p[1]};
function pil(){
 const y=S.settings.year,rows=S.tracker.filter(r=>(r.prod||"").startsWith(y+"-")),tot=rows.length;
 let h=`<div class="card"><h2>Pilar konten (diproduksi ${y})</h2><div class="scroll"><table><tr><th>Pilar</th><th class="r">Jumlah</th><th class="r">Aktual</th><th class="r">Target</th><th>Capaian</th></tr>`;
 PIL.forEach(p=>{const n=rows.filter(r=>r.pillar===p[0]).length,a=pct(n,tot),t=ptg(p);h+=`<tr><td>${esc(p[0])}</td><td class="r">${n}</td><td class="r">${a}%</td><td class="r">${t}%</td><td style="min-width:140px"><div class="bar"><i style="width:${Math.min(100,pct(a,t))}%"></i></div></td></tr>`});
 const nn=rows.filter(r=>!PN.includes(r.pillar)).length;
 return h+`</table></div><p class="note">Aktual = porsi tiap pilar dari seluruh konten diproduksi (${tot}). Capaian = aktual dibanding target porsi.${nn?" "+nn+" konten belum diberi pilar (ubah di Tracker).":""}</p></div>`;
}
function pr(){if(!Array.isArray(S.prodi)||S.prodi.length!==PRODI0.length)S.prodi=PRODI0.map(n=>({n,s:SLOT.map(t=>({t,d:false}))}));return S.prodi}
function prodi(){
 const P=pr();let all=0;
 const cards=P.map((p,pi)=>{const n=p.s.filter(x=>x.d).length;all+=n;return `<div class="card"><div class="row"><input class="grow" data-pn="${pi}" value="${esc(p.n)}" style="font-weight:700"><span class="pill ${n>=10?"t":""}">${n}/10</span></div><div class="bar" style="margin-bottom:8px"><i style="width:${n*10}%"></i></div>`+p.s.map((x,i)=>`<div class="row" style="margin-bottom:4px;flex-wrap:nowrap"><input type="checkbox" style="width:18px;height:18px;padding:0" data-c="${pi}.${i}" ${x.d?"checked":""}><input class="grow" data-t="${pi}.${i}" value="${esc(x.t)}"></div>`).join("")+`</div>`}).join("");
 $("#main").innerHTML=`<div class="card kpi"><span class="note">Video prodi selesai</span><b>${all}/${P.length*10}</b><div class="bar"><i style="width:${pct(all,P.length*10)}%"></i></div><span class="note">Centang jika video sudah diproduksi. Nama prodi dan jenis video bisa diubah langsung.</span></div><div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${cards}</div>`;
 document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{const[a,b]=c.dataset.c.split(".");P[a].s[b].d=c.checked;persist("prodi");prodi()});
 document.querySelectorAll("[data-t]").forEach(c=>c.onchange=()=>{const[a,b]=c.dataset.t.split(".");P[a].s[b].t=c.value;persist("prodi")});
 document.querySelectorAll("[data-pn]").forEach(c=>c.onchange=()=>{P[+c.dataset.pn].n=c.value;persist("prodi")});
}
function settings(){
 const s=S.settings;
 $("#main").innerHTML=`<div class="card"><h2>Pengaturan KPI</h2><div class="form">
 <label>Tahun dashboard<input id="s_year" type="number" value="${s.year}"></label>
 <label>Mulai pencatatan (untuk target)<input id="s_start" type="date" value="${kpiStart()}"></label>
 <label>Target konten diproduksi per hari<input id="s_tp" type="number" min="0" value="${s.tp}"></label>
 <label>Target konten ditayangkan per hari<input id="s_tpub" type="number" min="0" value="${s.tpub}"></label>
 <label>Target penambahan followers per platform (sejak mulai pencatatan)<input id="s_tf" type="number" min="0" value="${s.tf}"></label>${PIL.map((p,i)=>`<label>Target pilar ${esc(p[0])} (%)<input id="s_pt${i}" type="number" min="0" max="100" value="${ptg(p)}"></label>`).join("")}<p class="note" style="grid-column:1/-1">Target porsi pilar sebaiknya berjumlah 100%.</p></div>
 <div class="row" style="margin-top:12px"><button class="b p" id="ss">Simpan</button></div>
 <p class="note">Target dihitung dari target per hari dikali jumlah hari sejak tanggal mulai pencatatan sampai hari ini. Target followers adalah target penambahan followers baru per platform sejak tanggal mulai pencatatan, dan hanya dihitung untuk platform yang sudah punya data. Konten dihitung ditayangkan jika status Tayang dan tanggal tayang terisi.</p></div>
${trashCard()}
 <div class="card"><h2>Cadangan data</h2><p class="note">Ekspor berkala sebagai cadangan, atau pulihkan dari file cadangan sebelumnya.</p>
 <div class="row"><button class="b" id="ex">Ekspor cadangan (JSON)</button><input type="file" id="im" accept=".json"></div><div class="note" id="bk"></div></div>`;
 bindTrash();
 $("#ss").onclick=()=>{["year","tp","tpub","tf"].forEach(x=>s[x]=+$("#s_"+x).value||0);s.start=$("#s_start").value||"";s.pt={};PIL.forEach((p,i)=>{s.pt[p[0]]=+$("#s_pt"+i).value||0});persist("settings");cal.y=s.year;render()};
 $("#ex").onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="cadangan-sosmed-"+today()+".json";a.click();URL.revokeObjectURL(url);$("#bk").textContent="Cadangan berhasil diunduh.";
 };
 $("#im").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);DATA_KEYS.forEach(k=>{if(v[k]){S[k]=v[k];persist(k)}});$("#bk").textContent="Data berhasil dipulihkan."}catch(x){$("#bk").textContent="File cadangan tidak valid."}};r.readAsText(f)};
}
init();
</script>
